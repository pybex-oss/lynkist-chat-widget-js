# Publish to npm when a version tag is pushed:
#
#   1. bump "version" in package.json and add the CHANGELOG.md section
#   2. commit, then: git tag vX.Y.Z && git push origin main vX.Y.Z
#
# npm trusted publishing (OIDC): no npm token is stored anywhere. The package
# on npmjs.com trusts this repository and this workflow file
# (package → Settings → Trusted publishing → GitHub Actions:
# pybex-oss / lynkist-chat-widget-js / release.yml). Each version gets a
# provenance statement that links it to this commit and this run.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: The tag must match package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: The version must not be on npm yet
        run: |
          if npm view "@lynkist/chat-widget@$VERSION" version > /dev/null 2>&1; then
            echo "::error::@lynkist/chat-widget@$VERSION is already published"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs typecheck, lint, test and build first.
      - run: npm publish --provenance --access public
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            $0 == "## " v { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
